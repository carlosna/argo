{{- if .Values.istio.enabled }}
{{- if .Values.istio.gateway.create }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway.name }}
  {{- with .Values.istio.gateway.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: {{ .Values.istio.gateway.port }}
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istio.gateway.hosts | nindent 8 }}
---
{{- end }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "rollout-app.fullname" . }}
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ include "rollout-app.gatewayRef" . }}
  hosts:
    {{- toYaml .Values.istio.gateway.hosts | nindent 4 }}
  http:
    - name: {{ .Values.istio.virtualService.routeName }}
      route:
        - destination:
            host: {{ include "rollout-app.stableServiceName" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 100
        - destination:
            host: {{ include "rollout-app.canaryServiceName" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 0
{{- if .Values.istio.mtls.enabled }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "rollout-app.fullname" . }}
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rollout-app.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
{{- end }}
{{- if .Values.istio.authorizationPolicy.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "rollout-app.fullname" . }}-from-ingress
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rollout-app.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" .Values.istio.authorizationPolicy.ingressGatewayNamespace .Values.istio.authorizationPolicy.ingressGatewayServiceAccount | quote }}
{{- end }}
{{- end }}

