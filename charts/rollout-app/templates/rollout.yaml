apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "rollout-app.fullname" . }}
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  rollbackWindow:
    revisions: {{ .Values.rollout.revisionHistoryLimit }}
  analysis:
    successfulRunHistoryLimit: {{ .Values.rollout.analysisHistory.successful }}
    unsuccessfulRunHistoryLimit: {{ .Values.rollout.analysisHistory.unsuccessful }}
  selector:
    matchLabels:
      {{- include "rollout-app.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      stableService: {{ include "rollout-app.stableServiceName" . }}
      canaryService: {{ include "rollout-app.canaryServiceName" . }}
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      minPodsPerReplicaSet: {{ .Values.rollout.minPodsPerReplicaSet }}
      scaleDownDelaySeconds: {{ .Values.rollout.scaleDownDelaySeconds }}
      abortScaleDownDelaySeconds: {{ .Values.rollout.abortScaleDownDelaySeconds }}
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "rollout-app.fullname" . }}
            routes:
              - {{ .Values.istio.virtualService.routeName }}
      steps:
        {{- range .Values.rollout.steps }}
        {{- if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ include "rollout-app.fullname" $ }}-quality-gate
            args:
              - name: service
                value: {{ include "rollout-app.name" $ | quote }}
              - name: namespace
                value: {{ $.Release.Namespace | quote }}
              - name: revision
                value: {{ include "rollout-app.revision" $ | quote }}
        {{- else }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}
        {{- end }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "rollout-app.selectorLabels" . | nindent 8 }}
        service.istio.io/canonical-name: {{ include "rollout-app.name" . }}
        service.istio.io/canonical-revision: {{ include "rollout-app.revision" . | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rollout-app.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: application
          image: {{ include "rollout-app.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          {{- if .Values.temporaryStorage.enabled }}
          volumeMounts:
            - name: application-tmp
              mountPath: {{ .Values.temporaryStorage.mountPath }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.temporaryStorage.enabled }}
      volumes:
        - name: application-tmp
          emptyDir:
            sizeLimit: {{ .Values.temporaryStorage.sizeLimit }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

