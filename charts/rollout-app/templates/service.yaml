apiVersion: v1
kind: Service
metadata:
  name: {{ include "rollout-app.stableServiceName" . }}
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "rollout-app.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rollout-app.canaryServiceName" . }}
  labels:
    {{- include "rollout-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "rollout-app.selectorLabels" . | nindent 4 }}

